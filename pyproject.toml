[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ebay-comps"
version = "0.2.0"
description = "Price an item from eBay comparables: official eBay APIs, outlier-robust stats, and an LLM-written pricing recommendation."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Mike Cavallo" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "anthropic>=1.11",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
airtable = ["pyairtable>=2.3"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "fastapi>=0.110",
    "openai>=1.40",
]

[project.scripts]
ebay-comps = "ebay_comps.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ebay_comps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
